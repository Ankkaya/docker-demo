<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary-container": "#fef3c7",
              "surface-variant": "#ece1d3",
              "surface-container-highest": "#ece1d3",
              "on-surface-variant": "#64748b",
              "secondary-container": "#fedba1",
              "outline-variant": "#e2e8f0",
              "inverse-primary": "#fabc42",
              "surface-dim": "#e4d8cb",
              "surface": "#f8f7f6",
              "surface-container-lowest": "#ffffff",
              "on-secondary": "#ffffff",
              "on-error": "#ffffff",
              "surface-container-low": "#ffffff",
              "primary-fixed-dim": "#fabc42",
              "secondary-fixed-dim": "#e4c28a",
              "secondary-fixed": "#ffdea9",
              "tertiary": "#006491",
              "on-secondary-container": "#795e30",
              "tertiary-container": "#6ec5ff",
              "surface-tint": "#efb239",
              "on-primary-fixed": "#271900",
              "tertiary-fixed-dim": "#8aceff",
              "background": "#f8f7f6",
              "on-primary": "#ffffff",
              "on-error-container": "#93000a",
              "surface-container-high": "#f2e6d9",
              "error": "#ba1a1a",
              "on-primary-fixed-variant": "#5f4100",
              "error-container": "#ffdad6",
              "on-background": "#0f172a",
              "primary-fixed": "#ffdea9",
              "on-tertiary-fixed": "#001e2f",
              "on-primary-container": "#92400e",
              "outline": "#efb239",
              "surface-bright": "#ffffff",
              "secondary": "#745a2c",
              "primary": "#efb239",
              "on-secondary-fixed-variant": "#5a4317",
              "tertiary-fixed": "#c9e6ff",
              "on-tertiary-container": "#005176",
              "on-tertiary-fixed-variant": "#004c6e",
              "inverse-surface": "#1e293b",
              "on-surface": "#0f172a",
              "on-secondary-fixed": "#271900",
              "on-tertiary": "#ffffff",
              "inverse-on-surface": "#f8fafc",
              "surface-container": "#f8f7f6"
            },
            fontFamily: {
              "headline": ["Plus Jakarta Sans"],
              "body": ["Plus Jakarta Sans"],
              "label": ["Plus Jakarta Sans"]
            },
            borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface min-h-screen pb-24">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md shadow-sm flex items-center justify-between px-4 h-16 w-full">
<div class="flex items-center gap-4">
<button class="active:scale-95 transition-transform text-slate-600">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-['Plus_Jakarta_Sans'] font-bold text-lg tracking-tight text-on-surface">Add Address</h1>
</div>
<div class="w-10"></div> <!-- Spacer for balance -->
</header>
<main class="pt-24 px-5 max-w-2xl mx-auto">
<!-- Visual Anchor / Context Image -->
<div class="mb-8 rounded-3xl overflow-hidden h-40 relative group">
<img alt="Cozy nursery interior" class="w-full h-full object-cover" data-alt="Soft sunlit nursery room with organic cotton baby clothes hanging on a wooden rack and warm amber tones" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBWflscUis4bPk06JnQ1g1XhQUHoGAbm1B3XaOhP2gTAfuYWAvZMQKa-1aD8gBSMkAcJLPvkwc14ZBfRy3q32VCwqRDheZV7pZJj-tddlDhyHYNkGOrIRWb3IU0_m1TRDln9hWM8V-okhU73kgc0xhT3v_Hda0gDpqoAGnCLljP1Yw91G83sSvaNFoD5pLIUivzjgxWqK8IGztyLH28XEx7r5nmWw-ZknBqFea7wYX8xZbgDZ38qQgOqO41QdpW8psDPpGTA-0pjZzg"/>
<div class="absolute inset-0 bg-gradient-to-t from-slate-900/40 to-transparent"></div>
<div class="absolute bottom-4 left-6">
<span class="text-white text-[10px] font-bold tracking-widest uppercase bg-primary px-3 py-1 rounded-full">New Destination</span>
<p class="text-white font-bold text-xl mt-1">Shipping Details</p>
</div>
</div>
<!-- Form Section -->
<div class="space-y-6">
<!-- Recipient Name -->
<div class="space-y-2">
<label class="font-bold text-[10px] tracking-widest uppercase text-on-surface-variant ml-1">Recipient Name</label>
<div class="relative">
<input class="w-full bg-surface-bright border-none ring-1 ring-primary/10 focus:ring-primary rounded-xl px-4 py-4 text-sm placeholder:text-slate-400 transition-all outline-none" placeholder="e.g. Sarah Jenkins" type="text"/>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-primary/40" data-icon="person">person</span>
</div>
</div>
<!-- Phone Number -->
<div class="space-y-2">
<label class="font-bold text-[10px] tracking-widest uppercase text-on-surface-variant ml-1">Phone Number</label>
<div class="relative">
<input class="w-full bg-surface-bright border-none ring-1 ring-primary/10 focus:ring-primary rounded-xl px-4 py-4 text-sm placeholder:text-slate-400 transition-all outline-none" placeholder="+1 (555) 000-0000" type="tel"/>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-primary/40" data-icon="call">call</span>
</div>
</div>
<!-- Province/City/District Picker -->
<div class="space-y-2">
<label class="font-bold text-[10px] tracking-widest uppercase text-on-surface-variant ml-1">Province/City/District</label>
<button class="w-full bg-surface-bright border-none ring-1 ring-primary/10 hover:ring-primary/30 rounded-xl px-4 py-4 text-sm text-left flex justify-between items-center transition-all group">
<span class="text-slate-400 group-active:text-on-surface">Select Location</span>
<span class="material-symbols-outlined text-primary/60" data-icon="expand_more">expand_more</span>
</button>
</div>
<!-- Detailed Address -->
<div class="space-y-2">
<label class="font-bold text-[10px] tracking-widest uppercase text-on-surface-variant ml-1">Detailed Address</label>
<div class="relative">
<textarea class="w-full bg-surface-bright border-none ring-1 ring-primary/10 focus:ring-primary rounded-xl px-4 py-4 text-sm placeholder:text-slate-400 transition-all outline-none resize-none" placeholder="Street name, building number, apartment unit..." rows="4"></textarea>
<span class="material-symbols-outlined absolute right-4 top-4 text-primary/40" data-icon="location_on">location_on</span>
</div>
</div>
<!-- Default Switch -->
<div class="flex items-center justify-between p-4 bg-primary/5 rounded-2xl border border-primary/10">
<div class="flex items-center gap-3">
<div class="size-10 rounded-full bg-white flex items-center justify-center text-primary shadow-sm">
<span class="material-symbols-outlined" data-icon="star" style="font-variation-settings: 'FILL' 1;">star</span>
</div>
<div>
<p class="font-bold text-sm text-on-surface">Set as Default Address</p>
<p class="text-[10px] text-on-surface-variant">Used for future checkouts</p>
</div>
</div>
<label class="relative inline-flex items-center cursor-pointer">
<input checked="" class="sr-only peer" type="checkbox" value=""/>
<div class="w-11 h-6 bg-slate-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full rtl:peer-checked:after:-translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:start-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-primary"></div>
</label>
</div>
</div>
<!-- Decorative Spacer for Editorial Feel -->
<div class="py-12 flex justify-center">
<div class="w-12 h-1 bg-primary-container rounded-full"></div>
</div>
</main>
<!-- Bottom Action Area -->
<div class="fixed bottom-0 left-0 w-full bg-white/80 backdrop-blur-xl p-6 pb-8 shadow-[0_-4px_20px_0_rgba(0,0,0,0.03)] z-40">
<button class="w-full bg-primary text-white font-bold py-4 rounded-2xl shadow-lg shadow-primary/20 hover:opacity-90 active:scale-[0.98] transition-all flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-xl" data-icon="save">save</span>
<span>Save Address</span>
</button>
</div>
<!-- Hidden Map Context (Optional Aesthetic Element) -->
<div class="hidden">
<img data-alt="Stylized map showing neighborhood pins in warm gold and slate grey tones" data-location="San Francisco" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDdoWZ2aaAL3XyrSOaVljjzhIf0W0S6oyN2WsMU0neLU4mLVuktmJA1hGf2yCqQzrVkcA5Bt6OtfMXiFN_vP4kGNYXuKXfvXEzP_2gmKoe_XLpb6luRd4e-J9kZg9_rOM-SHt8UdRXSDBP8cHS04MjKz3roZTpMv6BsDys9HnPxOHCxERZTYlIzfWfMXWXKDM2_29siYJJP85ZU5xsCSbTClCuGA2LBQSARMjwKR_8gZoButiU5XRhKpPY18m-4aK0sYESUuMhduuTg"/>
</div>
</body></html>
