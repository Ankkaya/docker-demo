# 基础服务定义 — 所有环境共用
# 使用方式：
#   本地开发: docker compose up -d
#   测试环境: docker compose -f docker-compose.yaml -f docker-compose.staging.yaml up -d
#   正式环境: docker compose -f docker-compose.yaml -f docker-compose.production.yaml up -d

services:
  minio:
    image: minio/minio:latest
    container_name: demo-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  db:
    image: postgres:16-alpine
    container_name: demo-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: docker_demo
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d docker_demo"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: demo-backend
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/docker_demo?schema=public
      PORT: 3001
      FILE_BASE_URL: http://localhost:3001
      JWT_SECRET: your-super-secret-jwt-key-change-in-production
      NODE_ENV: production
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: false
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin123
      MINIO_BUCKET_NAME: docker-demo
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "3001:3001"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: demo-frontend
    depends_on:
      - backend
    ports:
      - "8080:8080"

volumes:
  db-data:
  minio-data:
